name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Published resolution: UV_NO_SOURCES ignores the [tool.uv.sources] editable
    # paths so the committed uv.lock resolves released siblings from PyPI. CI is
    # hermetic — no sibling checkouts. Local dev keeps sources (plain `uv sync`).
    env:
      UV_NO_SOURCES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv python install 3.13
      # The dev dependency group (installed by default) pulls the kubernetes
      # client via the [k8s] extra so the manager and its guard type-check and
      # the full test suite runs. --locked asserts the committed uv.lock is
      # current; --python pins the interpreter.
      - run: uv sync --locked --python 3.13
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing
      - name: Packaged descriptor
        # The wheel is what users install, so build it and assert the plugin
        # descriptor really travels inside it -- at the import path the loader
        # reads, declaring the same version as the project metadata.
        run: |
          set -euo pipefail
          uv build --wheel --out-dir dist
          wheel=$(ls dist/*.whl)
          version=$(uv run --no-sync python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          descriptor=$(unzip -p "$wheel" tai42_config_k8s/tai-plugin.yml) || {
            echo "::error::$wheel does not package tai42_config_k8s/tai-plugin.yml"
            unzip -l "$wheel"
            exit 1
          }
          printf '%s\n' "$descriptor" | grep -qx "version: $version" || {
            echo "::error::$wheel packages a tai-plugin.yml that does not declare version: $version"
            printf '%s\n' "$descriptor"
            exit 1
          }
