name: Bug report
description: Report a defect in tai-config-k8s (the Kubernetes ConfigManager provider — Secrets for env, ConfigMaps for manifest)
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or code that reproduce the problem (e.g. a read_env/read_manifest call that fails, a merge that drops keys, a namespace that resolves wrong).
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tai-config-k8s version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, kubernetes client version, and whether running in-cluster or against a kubeconfig.
      placeholder: "Python 3.13.x, macOS 15, kubernetes 28.x, in-cluster"
    validations:
      required: true
